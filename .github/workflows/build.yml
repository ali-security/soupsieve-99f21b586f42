name: build

on:
  workflow_dispatch: {}

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: 3.9
            linux-python-version: '3.9.16'
          - tox-env: py310
            python-version: '3.10'
            linux-python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11'
            linux-python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11'
            linux-python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10'
            linux-python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}
      PIP_INDEX_URL: "https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ (runner.os == 'Linux' && matrix.linux-python-version) || matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      run: |
        python -m tox
